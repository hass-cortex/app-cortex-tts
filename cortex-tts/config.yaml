---
name: Cortex TTS
description: On-device text-to-speech for Home Assistant — three ONNX models running locally, built-in voices or one cloned from a short recording, plus the Chinese text pipeline they all lack
version: "dev"
slug: cortex_tts
url: https://github.com/hass-cortex/app-cortex-tts
arch:
  - amd64
startup: services
init: false
homeassistant: 2026.3.0
timeout: 300
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8771
panel_icon: mdi:account-voice
panel_title: Cortex TTS
discovery:
  - cortex_tts
# Unpublished by default: the integration reaches the app over the hassio
# network by hostname, and ingress serves the admin UI. Publishing the port
# exposes the API key to anything on the LAN that can read a header.
ports:
  8771/tcp: null
ports_description:
  8771/tcp: TTS HTTP API and Admin UI (optional; bearer key required)
watchdog: http://[HOST]:[PORT:8771]/health
ingress_stream: true
map:
  - type: share
    read_only: false
# Only what has to be settled before the process starts. Everything else —
# threads, execution provider, resident models, default model and voice,
# temperature, preload — is in the app's own UI, where changing it costs
# neither a restart nor, when the list of choices changes, a rebuild.
options:
  log_level: info
  discovery_api_key: ""
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
  discovery_api_key: password?
