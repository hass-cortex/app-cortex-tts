[project]
name = "cortex-tts"
dynamic = ["version"]
description = "On-device text-to-speech for Home Assistant, with the Chinese text pipeline the models lack"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "aiohttp>=3.10",
    "numpy>=1.26",
    "soundfile>=0.12",
    # MP3 for the streaming endpoint. A WAV stream has to declare a length it
    # does not know, and a general-purpose player given the maximal one waits
    # for a file it thinks is six hours long; MP3 is a bare frame sequence
    # with no length to declare.
    "lameenc>=1.7",
    "scipy>=1.13",
    "tokenizers>=0.15",
    # MOSS-TTS-Nano tokenises with a SentencePiece model.
    "sentencepiece>=0.2",
    # Not listed by upstream, but required: the LM and fine-local weights ship
    # as BF16 and are rewritten to FP32 at load because ORT's CPU provider has
    # no BF16 kernels for these ops. Without it the session fails to create.
    "onnx>=1.16",
    "huggingface-hub>=0.24",
    # The decisive dependency: this model has no pronunciation for Traditional
    # Chinese glyphs (32% character error rate against 4% once converted).
    "opencc-python-reimplemented>=0.1.7",
    "num2words>=0.5.14",
    "babel>=2.17",
]

[project.optional-dependencies]
# OmniVoice's pipeline is PyTorch, and only its transformer is replaced by the
# ONNX graph — the audio tokenizer, the prompt handling and the iterative
# decoder all stay in torch. `transformers` is not optional for it either: the
# Higgs Audio V2 tokenizer is a model class that ships there.
#
# The `omnivoice` package on PyPI is not used. It requires gradio, accelerate,
# webdataset and tensorboardx for its demo, training loop and data pipeline,
# none of which inference touches; the six modules that do are vendored under
# `cortex_speech/vendor/omnivoice/`.
omnivoice = [
    "torch>=2.4",
    "torchaudio>=2.4",
    # Reference recordings are resampled and trimmed with librosa.
    "librosa>=0.10",
    "transformers>=5.17",
    # Silence trimming on reference recordings.
    "pydub>=0.25",
    # pydub imports `audioop`, which PEP 594 removed from the standard library
    # in 3.13. The image is older than that; a source checkout need not be.
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.scripts]
cortex-tts = "cortex_tts.__main__:main"

[dependency-groups]
# ONNX Runtime is one build or the other, never both: the CPU and the GPU wheel
# unpack into the same package directory and whichever installs later shadows
# the first, silently. So neither is a base dependency; `cpu` is a default
# group and the CUDA groups replace it — `uv sync --no-default-groups
# --group cuda --group dev`. Which CUDA generation a driver can serve decides
# between the two GPU groups; the wheels ship the CUDA libraries themselves.
cpu = ["onnxruntime>=1.20"]
cuda = [
    "onnxruntime-gpu==1.29.*",
    "nvidia-cuda-runtime; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc; sys_platform == 'linux'",
    "nvidia-cublas; sys_platform == 'linux'",
    "nvidia-cufft; sys_platform == 'linux'",
    "nvidia-curand; sys_platform == 'linux'",
    "nvidia-cudnn-cu13; sys_platform == 'linux'",
]
cuda12 = [
    "onnxruntime-gpu==1.26.*",
    "nvidia-cuda-runtime-cu12; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'linux'",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cufft-cu12; sys_platform == 'linux'",
    "nvidia-curand-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cortex_tts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_tts"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }, { group = "cuda12" }]]

# CPU-only torch wheels: the addon has no GPU and the CUDA build is a 2 GB
# download that would never be used; only the ONNX sessions move to a card.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM", "UP", "N", "ASYNC", "RUF013"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Vendored upstream code is kept diffable against its source, not restyled.
# Listed file by file rather than as `vendor/**`: one file in that directory
# is ours — `omnivoice_ort.py` is original glue — and a blanket ignore
# put 726 lines of our own code outside both linters without anyone deciding
# to.
"src/cortex_speech/vendor/hojo40.py" = ["ALL"]
"src/cortex_speech/vendor/moss_ort.py" = ["ALL"]
"src/cortex_speech/vendor/moss_runtime.py" = ["ALL"]
"src/cortex_speech/vendor/omnivoice/**/*.py" = ["ALL"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = [
    "tests",
    # Upstream code only; the two derived files in that directory are checked.
    "src/cortex_speech/vendor/hojo40.py",
    "src/cortex_speech/vendor/moss_ort.py",
    "src/cortex_speech/vendor/moss_runtime.py",
    "src/cortex_speech/vendor/omnivoice",
    "**/__pycache__",
]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
