---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/cortex-tts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # Wait N days after a release before opening a PR — avoid 0-day regressions
    cooldown:
      default-days: 7
      semver-major-days: 30
    # The cuda/cuda12 groups pin onnxruntime-gpu to the build each CUDA generation
    # serves (docs/standalone.md); a bump needs a GPU host, not a lockfile refresh.
    ignore:
      - dependency-name: "onnxruntime-gpu"
    groups:
      # Minor/patch bumps only — majors get their own PR for manual review
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
    # Major bumps only; minor and patch releases of an action are not worth a PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      actions:
        patterns: ["*"]
