---
name: Deploy

concurrency:
  group: queue

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/app-ci.yaml

  information:
    name: Gather app information
    needs: ci
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.information.outputs.architectures }}
      environment: ${{ steps.release.outputs.environment }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      name: ${{ steps.information.outputs.name }}
      slug: ${{ steps.information.outputs.slug }}
      target: ${{ steps.information.outputs.target }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read app information
        id: information
        # frenck/action-addon-information requires a build.yaml, which no app has
        run: |
          config=$(find . -mindepth 2 -maxdepth 2 -name config.yaml -not -path './.github/*' -printf '%P\n' | head -1)
          if [[ -z "${config}" ]]; then
            echo "::error ::Could not find the app's config.yaml"
            exit 1
          fi
          {
            echo "target=$(dirname "${config}")"
            echo "architectures=$(yq -o=json -I=0 '.arch' "${config}")"
            echo "name=$(yq '.name' "${config}")"
            echo "slug=$(yq '.slug' "${config}")"
          } >> "$GITHUB_OUTPUT"
      - name: Gather version and environment
        id: release
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG_NAME,,}"
          version="${version#v}"
          environment="stable"
          if [[ "${IS_PRERELEASE}" = "true" ]]; then
            environment="beta"
          fi

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.information.outputs.architectures }}
          image-name: ${{ steps.information.outputs.slug }}

  deploy:
    name: Build & Deploy ${{ matrix.arch }}
    needs: information
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJson(needs.information.outputs.matrix) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          cache-image-tag: ${{ needs.information.outputs.environment }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ needs.information.outputs.target }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.information.outputs.version }}
            ${{ needs.information.outputs.environment }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          version: ${{ needs.information.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - information
      - deploy
    permissions:
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.information.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.information.outputs.slug }}
          image-tags: |
            ${{ needs.information.outputs.version }}
            ${{ needs.information.outputs.environment }}

  publish-beta:
    name: Publish to beta repository
    if: needs.information.outputs.environment == 'beta' || needs.information.outputs.environment == 'stable'
    needs:
      - information
      - manifest
    environment:
      name: beta
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository updater update signal
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/repository-beta
          event-type: update
          client-payload: >
            {
              "app": "${{ needs.information.outputs.slug }}",
              "name": "${{ needs.information.outputs.name }}",
              "repository": "${{ github.repository }}",
              "version": "${{ github.event.release.tag_name }}"
            }

  publish-stable:
    name: Publish to stable repository
    if: needs.information.outputs.environment == 'stable'
    needs:
      - information
      - manifest
    environment:
      name: stable
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository updater update signal
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/repository
          event-type: update
          client-payload: >
            {
              "app": "${{ needs.information.outputs.slug }}",
              "name": "${{ needs.information.outputs.name }}",
              "repository": "${{ github.repository }}",
              "version": "${{ github.event.release.tag_name }}"
            }
