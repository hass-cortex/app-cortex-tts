---
name: Python checks

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      cache:
        description: >-
          Restore the uv cache. Off for tag builds, which must not read
          anything a pull request could have written.
        type: boolean
        default: true

permissions: {}

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cortex-tts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ inputs.cache }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run --with pyright pyright

      - name: Run tests
        run: uv run pytest -q
