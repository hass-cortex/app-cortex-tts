---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  # A tag that fails here never becomes a release, so a broken build cannot
  # reach the catalog and from there someone's install.
  checks:
    uses: ./.github/workflows/python-checks.yml
    permissions:
      contents: read
    with:
      cache: false

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [checks]
    # The release is created with DISPATCH_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes need the tags
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Generate release notes
        # Rendered from the conventional commits since the previous version tag,
        # under Breaking Changes / Features / Fixes / Other Changes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          prev_tag=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | grep -vx "${TAG_NAME}" | head -1)
          status=0
          uvx --from commitizen==4.19.0 cz changelog --dry-run \
            --template .github/release-notes.md.j2 \
            ${prev_tag:+--start-rev "${prev_tag}"} > body.md || status=$?
          # 3 = no commits since the previous tag; anything else is a real failure
          if [[ "${status}" -ne 0 && "${status}" -ne 3 ]]; then
            exit "${status}"
          fi
          # Only ci/docs/chore commits render nothing; a release body is never empty
          if ! grep -q '[^[:space:]]' body.md; then
            printf '## Other Changes\n\n- Build, CI and documentation changes only\n' > body.md
          fi
          cat body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Use the PAT so the release.published event triggers deploy.yaml.
          # GITHUB_TOKEN-created releases do not trigger downstream workflows.
          token: ${{ secrets.DISPATCH_TOKEN }}
          name: ${{ github.ref_name }}
          body_path: body.md
          # Semver pre-release tags (0.2.0-beta.1) are marked prerelease so
          # deploy.yaml routes them to repository-beta only, leaving the
          # stable catalog untouched.
          prerelease: ${{ contains(github.ref_name, '-') }}
