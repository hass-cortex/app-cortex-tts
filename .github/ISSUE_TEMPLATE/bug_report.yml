---
name: Bug Report
description: Report a bug with Cortex TTS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.

  - type: input
    id: version
    attributes:
      label: Cortex TTS version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Deployment environment
      options:
        - Home Assistant OS app (amd64)
        - Home Assistant Supervised app (amd64)
        - Run outside Home Assistant (say how, below)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Start Cortex TTS with the 40M model downloaded
        2. Send text via `tts.speak` or `POST /api/speak`
        3. Observe the error in the app log or the wrong audio
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the app log (set `log_level` to `debug` first if you can) and, for a wrong reading, the prepared text the admin UI shows
      render: text

  - type: textarea
    id: hardware
    attributes:
      label: Hardware info
      description: CPU, RAM, GPU (if applicable)
      placeholder: |
        CPU: Intel i5-12400 (4 cores given to the HA VM)
        RAM: 16GB
        Model: hojo-40m, sensor.<model>_real_time_factor reads 0.53

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, screenshots, or config
