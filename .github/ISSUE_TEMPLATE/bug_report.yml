---
name: Bug Report
description: Report a bug with Cortex TTS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.

  - type: input
    id: version
    attributes:
      label: Cortex TTS version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Deployment environment
      options:
        - Home Assistant App
        - Docker
        - Docker Compose
        - Bare metal (systemd)
        - Proxmox LXC
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Start Cortex TTS with the 40M model
        2. Send audio via HTTP API
        3. Observe error in logs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant log output (use debug logging if possible)
      render: text

  - type: textarea
    id: hardware
    attributes:
      label: Hardware info
      description: CPU, RAM, GPU (if applicable)
      placeholder: |
        CPU: Intel i5-12400
        RAM: 16GB
        GPU: NVIDIA RTX 3060 (CUDA 12.x)

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, screenshots, or config
